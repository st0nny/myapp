/* todo */
var TL={todo:"대기",doing:"진행 중",done:"완료"};
function tst(x){return x.status||(x.done?"done":"todo");}
function setT(x,s){x.status=s;x.done=s==="done";save(x);}
function tkey(a){return (a.due||"9999")+(a.time||"99:99");}
function todoCard(x){
 if(editId===x.id)return todoForm(x);
 var s=tst(x);
 return $("div",{class:"card item"+(s==="done"?" done":"")},
  $("button",{type:"button",class:"chk",textContent:s==="done"?"✓":"",title:"완료 토글",on:{click:function(){setT(x,s==="done"?"todo":"done");}}}),
  $("div",{class:"main"},$("div",{class:"t",textContent:x.text}),
   $("div",{class:"meta"},s==="doing"?$("span",{class:"badge doing",textContent:"진행 중"}):null,(x.due?"📅 "+fmt(x.due):"")+(x.time?" ⏰ "+x.time:"")),
   x.memo?$("div",{class:"quote",textContent:x.memo}):null,
   $("div",{class:"row",style:"margin-top:8px;gap:6px"},
    s!=="done"?btn(s==="doing"?"⏸ 진행 중 해제":"▶ 진행 중으로",function(){setT(x,s==="doing"?"todo":"doing");}):null,
    ...rowBtns(x))));
}

  stat=opts($("select"),[["todo","대기"],["doing","진행 중"],["done","완료"]],tst(e));
 return $("form",{class:"card",on:{submit:function(ev){ev.preventDefault();
  var s=stat.value,o=Object.assign({},e,{id:e.id||nid(),kind:"todo",text:text.value.trim(),due:due.value,time:time.value,memo:memo.value.trim(),status:s,done:s==="done",tz:Intl.DateTimeFormat().resolvedOptions().timeZone,created:e.created||Date.now()});
  if(e.due!==o.due||e.time!==o.time)o.notified=false;

  text,$("div",{class:"row"},lab("날짜",due),lab("시간",time)),$("div",{class:"row"},lab("상태",stat)),memo,
  $("div",{class:"row"},$("button",{class:"btn",textContent:x?"저장":"추가"}),x?cancelBtn():null));

function pmsg(t){var e=document.getElementById("pushmsg");if(e)e.textContent=t;}
async function enablePush(){
 try{
  pmsg("⏳ 1/4 알림 권한 요청 중…");
  var p=await Notification.requestPermission();
  if(p!=="granted"){pmsg("❌ 알림 권한이 '"+p+"' 상태예요. 브라우저/폰 설정 > 사이트(또는 앱) 알림에서 '허용'으로 바꾼 뒤 다시 눌러주세요.");return;}
  pmsg("⏳ 2/4 서비스워커 준비 중… (최대 10초)");
  var reg=await navigator.serviceWorker.register("sw.js");
  for(var i=0;i<40&&!reg.active;i++)await new Promise(function(r){setTimeout(r,250);});
  if(!reg.active)throw new Error("서비스워커가 활성화되지 않았어요. 저장소 루트에 sw.js가 있는지, 주소/sw.js가 열리는지 확인하세요.");
  if(!firebase.messaging.isSupported())throw new Error("이 환경은 웹 푸시를 지원하지 않아요 (아이폰은 홈 화면에 추가한 앱에서만 가능)");
  if(VAPID_KEY.indexOf("YOUR")===0)throw new Error("VAPID_KEY가 비어 있어요");
  pmsg("⏳ 3/4 푸시 토큰 발급 중…");
  var tk=await firebase.messaging().getToken({vapidKey:VAPID_KEY,serviceWorkerRegistration:reg});
  if(!tk)throw new Error("토큰이 비어 있어요");
  pmsg("⏳ 4/4 저장 중…");
  await fdb.collection("users").doc(user.uid).collection("devices").doc(tk).set({token:tk,ua:navigator.userAgent.slice(0,80),updated:Date.now()});
  localStorage.setItem("pushOn","1");render();pmsg("✅ 푸시 등록 완료! '🧪 테스트 알림'으로 기기 표시를 확인해 보세요.");
 }catch(err){pmsg("❌ "+(err.code||"")+" "+err.message);}
}
async function testPush(){
 try{
  if(Notification.permission!=="granted"){pmsg("❌ 먼저 알림 권한을 허용하세요 (왼쪽 버튼)");return;}
  var r=await navigator.serviceWorker.getRegistration();if(!r)throw new Error("서비스워커가 없어요");
  await r.showNotification("🧪 테스트 알림",{body:"이게 보이면 이 기기의 알림 표시는 정상이에요",icon:"icon-192.png"});
  pmsg("✅ 테스트 알림을 보냈어요 (알림창을 확인하세요)");
 }catch(err){pmsg("❌ "+err.message);}
}
function todoView(v){

  v.appendChild($("div",{class:"s",id:"pushmsg",style:"margin-bottom:8px",textContent:"알림 권한: "+Notification.permission+(on?" · 푸시 등록됨":" · 미등록")}));

  var ev={};all.forEach(function(x){if(x.due)(ev[x.due]=ev[x.due]||[]).push(x);});
  v.appendChild(calendar("todo",ev,function(l){
   if(!l.length)return "";var n=l.filter(function(x){return tst(x)!=="done";}).length;
   return $("div",{class:"tt",style:"margin-top:auto;padding-bottom:2px",textContent:n?"● "+n:"✓"});}));
  if(sel.todo){var l=(ev[sel.todo]||[]).sort(function(a,b){return tkey(a).localeCompare(tkey(b));});
   v.appendChild($("h3",{textContent:fmt(sel.todo)}));if(!l.length)v.appendChild($("div",{class:"empty",textContent:"이날은 할일이 없어요"}));l.forEach(function(x){v.appendChild(todoCard(x));});}

 }
 v.appendChild(chips(["전체","대기","진행 중","완료"],function(){return flt.todo;},function(c){flt.todo=c;}));
 var vis=all.filter(function(x){return flt.todo==="전체"||TL[tst(x)]===flt.todo;});
 var t=today(),G=[["🔥 진행 중",function(x){return tst(x)==="doing";}],["⚠️ 지난 할일",function(x){return tst(x)==="todo"&&x.due&&x.due<t;}],["오늘",function(x){return tst(x)==="todo"&&x.due===t;}],["예정",function(x){return tst(x)==="todo"&&(!x.due||x.due>t);}],["완료",function(x){return tst(x)==="done";}]];

 G.forEach(function(g){
  var l=vis.filter(g[1]).sort(function(a,b){return tkey(a).localeCompare(tkey(b));});
  if(!l.length)return;v.appendChild($("h3",{textContent:g[0]+" ("+l.length+")"}));
  l.forEach(function(x){v.appendChild(todoCard(x));});

function fire(x){var t="⏰ "+x.text,o={body:x.memo||x.time};if(swr&&swr.showNotification)swr.showNotification(t,o);else new Notification(t,o);}
function notifyCheck(){
 if(localStorage.getItem("pushOn"))return;
 if(!("Notification" in window)||Notification.permission!=="granted")return;
 var n=new Date(),d=today(),mins=n.getHours()*60+n.getMinutes(),seen;
 try{seen=JSON.parse(localStorage.getItem("notified")||"{}");}catch(e){seen={};}
 items.forEach(function(x){
  if(x.kind!=="todo"||x.done||x.due!==d||!x.time)return;
  var tm=+x.time.slice(0,2)*60+ +x.time.slice(3,5),k=x.id+d+x.time;
  if(mins-tm>=0&&mins-tm<=60&&!seen[k]){seen[k]=1;fire(x);}
 });
 try{localStorage.setItem("notified",JSON.stringify(seen));}catch(e){}
}
setInterval(notifyCheck,30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(function(r){swr=r;}).catch(function(){});
init();
})();
