<html lang="ko">

<style>

:root[data-theme="dark"]{--bg:#141414;--card:#1e1e1e;--tx:#f2f2f2;--sub:#9a9a9f;--bd:#333;--ac:#ff6a52;--ac2:#3a211c;--ok:#4cc38a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;line-height:1.5}
.wrap{max-width:760px;margin:0 auto;padding:16px}

h1{font-size:20px;margin:0}
.tabs{display:flex;gap:6px;margin-bottom:14px;border-bottom:1px solid var(--bd)}
.tab{flex:1;padding:10px 4px;background:none;border:0;border-bottom:2px solid transparent;color:var(--sub);font-size:15px;font-weight:600;cursor:pointer}
.tab.on{color:var(--ac);border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
form.card{display:grid;gap:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input:not([type=file]),select,textarea{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);font:inherit;color:var(--tx)}
textarea{resize:vertical;min-height:50px}
button{font:inherit;color:var(--tx)}
.btn{padding:8px 14px;border-radius:8px;border:0;background:var(--ac);color:#fff;font-weight:600;cursor:pointer}
.ghost{background:none;border:1px solid var(--bd);color:var(--sub);padding:4px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{padding:3px 11px;border-radius:99px;border:1px solid var(--bd);background:var(--card);color:var(--sub);font-size:13px;cursor:pointer}
.chip.on{background:var(--ac2);color:var(--ac);border-color:var(--ac)}
.item{display:flex;gap:10px;align-items:flex-start}
.item .main{flex:1;min-width:0}
.t{font-weight:600;word-break:break-word}
.t a{color:inherit;text-decoration:none}
.s{font-size:13px;color:var(--sub);word-break:break-word}
.lb{font-size:12px;color:var(--sub);display:flex;align-items:center;gap:4px;flex:1;min-width:120px}
.mini{padding:4px 6px;font-size:13px}
.star{position:relative;display:inline-block;width:1.15em;color:#c9c9c9;font-size:20px;line-height:1}
.star i{position:absolute;left:0;top:0;overflow:hidden;color:#f5a623;font-style:normal;white-space:nowrap}
.star b{position:absolute;top:0;height:100%;width:50%;cursor:pointer}
.tag{font-size:12px;color:var(--ac);margin-right:6px}
.chk{width:26px;height:26px;flex:none;border-radius:50%;border:2px solid var(--bd);background:none;cursor:pointer;color:#fff;font-size:15px;line-height:1;padding:0;margin-top:1px}
.done .chk{background:var(--ok);border-color:var(--ok)}
.done .t{text-decoration:line-through;color:var(--sub)}
.poster{width:56px;height:80px;object-fit:cover;border-radius:6px;background:var(--bd);flex:none}
.empty{text-align:center;color:var(--sub);padding:28px 0}
h3{font-size:13px;color:var(--sub);margin:16px 0 6px}
#st{font-size:12px;color:var(--sub)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-bottom:10px}
.cal .dw{text-align:center;font-size:12px;color:var(--sub)}
.day{aspect-ratio:2/3;border:1px solid var(--bd);border-radius:8px;background:var(--card);padding:2px;font-size:11px;color:var(--sub);cursor:pointer;overflow:hidden;position:relative;display:flex;flex-direction:column;align-items:center}
.day.sel{border-color:var(--ac);background:var(--ac2)}
.day.td span.n{color:var(--ac);font-weight:700}
.day img{width:100%;flex:1;min-height:0;object-fit:cover;border-radius:4px}
.day .bd{position:absolute;right:3px;bottom:3px;background:var(--ac);color:#fff;border-radius:99px;padding:0 5px;font-size:10px}
.day .tt{font-size:10px;color:var(--tx);word-break:break-all;overflow:hidden;line-height:1.2}
.cn{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;font-weight:600}
</style>
</head>
<body>

/* bookmarks */

function todoCard(x){
 return $("div",{class:"card item"+(x.done?" done":"")},
  $("button",{type:"button",class:"chk",textContent:x.done?"✓":"",title:"완료 토글",on:{click:function(){x.done=!x.done;save(x);}}}),
  $("div",{class:"main"},$("div",{class:"t",textContent:x.text}),
   (x.due||x.time)?$("div",{class:"s",textContent:(x.due?"📅 "+x.due:"")+(x.time?" ⏰ "+x.time:"")}):null,
   x.memo?$("div",{class:"s",textContent:x.memo}):null),delBtn(x.id));
}
function tkey(a){return (a.due||"9999")+(a.time||"99:99");}
function todoView(v){
 var text=$("input",{placeholder:"할일을 입력하세요",required:true}),due=$("input",{type:"date",value:(mode.todo==="cal"&&sel.todo)||today()}),time=$("input",{type:"time"}),memo=$("textarea",{placeholder:"메모 (선택)"});
 v.appendChild($("form",{class:"card",on:{submit:function(e){e.preventDefault();
  save({id:nid(),kind:"todo",text:text.value.trim(),due:due.value,time:time.value,memo:memo.value.trim(),done:false,created:Date.now()});}}},
  text,$("div",{class:"row"},lab("날짜",due),lab("시간",time)),memo,$("button",{class:"btn",textContent:"추가"})));
 if("Notification" in window&&Notification.permission!=="granted")v.appendChild($("div",{class:"chips"},$("span",{class:"chip on",textContent:"🔔 할일 알림 켜기",on:{click:function(){Notification.requestPermission().then(render);}}})));
 v.appendChild(toggle("todo"));
 var all=items.filter(function(x){return x.kind==="todo";});
 if(mode.todo==="cal"){
  var ev={};all.forEach(function(x){if(x.due)(ev[x.due]=ev[x.due]||[]).push(x);});
  v.appendChild(calendar("todo",ev,function(l){
   if(!l.length)return "";var n=l.filter(function(x){return !x.done;}).length;
   return $("div",{class:"tt",style:"margin-top:auto;padding-bottom:2px",textContent:n?"● "+n:"✓"});}));
  if(sel.todo){var l=(ev[sel.todo]||[]).sort(function(a,b){return tkey(a).localeCompare(tkey(b));});
   v.appendChild($("h3",{textContent:sel.todo}));if(!l.length)v.appendChild($("div",{class:"empty",textContent:"이날은 할일이 없어요"}));l.forEach(function(x){v.appendChild(todoCard(x));});}
  return;
 }
 v.appendChild(chips(["전체","진행 중","완료"],function(){return flt.todo;},function(c){flt.todo=c;}));
 var vis=all.filter(function(x){return flt.todo==="전체"||(flt.todo==="완료")===!!x.done;});
 var t=today(),groups=[["⚠️ 지난 할일",function(x){return !x.done&&x.due&&x.due<t;}],["오늘",function(x){return !x.done&&x.due===t;}],["예정",function(x){return !x.done&&(!x.due||x.due>t);}],["완료",function(x){return x.done;}]];
 if(!vis.length)v.appendChild($("div",{class:"empty",textContent:"할일이 없어요 🎉"}));
 groups.forEach(function(g){
  var l=vis.filter(g[1]).sort(function(a,b){return tkey(a).localeCompare(tkey(b));});
  if(!l.length)return;v.appendChild($("h3",{textContent:g[0]+" ("+l.length+")"}));
  l.forEach(function(x){v.appendChild(todoCard(x));});
 });
}
function fire(x){var t="⏰ "+x.text,o={body:x.memo||x.time};if(swr&&swr.showNotification)swr.showNotification(t,o);else new Notification(t,o);}
function notifyCheck(){
 if(!("Notification" in window)||Notification.permission!=="granted")return;
 var n=new Date(),d=today(),mins=n.getHours()*60+n.getMinutes(),seen;
 try{seen=JSON.parse(localStorage.getItem("notified")||"{}");}catch(e){seen={};}
 items.forEach(function(x){
  if(x.kind!=="todo"||x.done||x.due!==d||!x.time)return;
  var tm=+x.time.slice(0,2)*60+ +x.time.slice(3,5),k=x.id+d+x.time;
  if(mins-tm>=0&&mins-tm<=60&&!seen[k]){seen[k]=1;fire(x);}
 });
 try{localStorage.setItem("notified",JSON.stringify(seen));}catch(e){}
}
setInterval(notifyCheck,30000);
if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js").then(function(r){swr=r;}).catch(function(){});
init();
})();
</script>
</body>
</html>
